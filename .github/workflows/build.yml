name: Build OpBroadcast from zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List available voicechat-api versions
        run: curl -s https://maven.maxhenkel.de/repository/public/de/maxhenkel/voicechat/voicechat-api/maven-metadata.xml

      - name: Unzip the project
        run: unzip -o *.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: opbroadcast-plugin
        run: mvn -B clean package

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpBroadcast-jar
          path: opbroadcast-plugin/target/OpBroadcast-*.jar
          if-no-files-found: error
